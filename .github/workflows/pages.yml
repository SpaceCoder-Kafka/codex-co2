name: Website
on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/social-preview.png
      - assets/promo-feedback.mp4
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Assemble static landing page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Copy the landing page and its published media
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/media
          cp assets/social-preview.png _site/media/social-preview.png
          cp assets/promo-feedback.mp4 _site/media/demo-zh.mp4
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
