name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    name: macOS synthetic checks and Universal macOS 14 deployment
    # GitHub retires hosted macos-14 images on 2026-11-02. This job checks
    # deployment targets on macOS 26; macOS 14 native acceptance is separate.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:public
      - run: npm run notices:check
      - run: npm run test:licenses
      - name: Prepare verified Sparkle for native update tests
        run: node --input-type=module -e 'import { sparkleDistribution } from "./scripts/sparkle-distribution.mjs"; await sparkleDistribution(".coop/build-cache");'
      - run: npm test
      - name: Install isolated test backend only
        run: |
          npm install --prefix "$RUNNER_TEMP/co2-test-cli" --ignore-scripts --no-audit --no-fund --no-save @openai/codex@0.163.0
          # The isolated fixture PATH deliberately excludes development tools.
          # Use the native executable, not npm's Node.js launcher.
          co2_test_binary="$RUNNER_TEMP/co2-test-cli/node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin/bin/codex"
          test "$("$co2_test_binary" --version)" = "codex-cli 0.163.0"
          printf 'CODEX_COOP_CLI=%s\n' "$co2_test_binary" >> "$GITHUB_ENV"
      - run: npm run test:integration:required
      - name: Build Universal package without replacing an installed application
        run: npm run build:macos
      - name: Verify Universal bundle and both native architecture slices
        run: npm run check:macos
      - name: Assert macOS 14 package deployment target
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const manifest = JSON.parse(fs.readFileSync("dist/Codex Co².app/Contents/Resources/manifest.json", "utf8")); assert.equal(manifest.minimumMacOS, "14.0");'
      - name: Save macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-universal-unnotarized
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*-universal*.dmg
            dist/*-universal*.dmg.sha256
            dist/*-universal*.dmg.source.json
            dist/RELEASE_NOTES.md

  windows:
    name: Windows native security checks and x64 package
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CO2_BUILD_PYTHON: python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Isolate Windows SDK state
        run: |
          $co2DotnetHome = Join-Path $env:RUNNER_TEMP 'co2-dotnet-home'
          New-Item -ItemType Directory -Force -Path $co2DotnetHome | Out-Null
          "DOTNET_CLI_HOME=$co2DotnetHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.426'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned NSIS packaging tool
        run: |
          choco upgrade nsis --version=3.13 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $co2Nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path $co2Nsis)) { throw 'Pinned NSIS executable is unavailable' }
          "CO2_BUILD_NSIS=$co2Nsis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:public
      - run: npm run notices:check
      - run: python -m unittest discover -s test -p test_cloudflared_notices.py
      - name: Run Windows application policy fixtures
        run: |
          $co2PolicyRoot = Join-Path $env:RUNNER_TEMP 'co2-policy-fixtures'
          dotnet build windows/PolicyTests/PolicyTests.csproj --configuration Release --output "$co2PolicyRoot/bin" "-p:BaseIntermediateOutputPath=$co2PolicyRoot/obj/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet (Join-Path $co2PolicyRoot 'bin/PolicyTests.dll')
      - name: Build Windows package with bundled runtime
        run: npm run build:windows
      - name: Verify Windows package provenance and PE architecture
        run: npm run check:windows
      - name: Check native policy, private ACLs and authenticated synthetic pipe
        run: |
          $env:CO2_PLATFORM_BRIDGE = Join-Path $env:GITHUB_WORKSPACE 'dist/windows/CodexCo2/CodexCo2.exe'
          node --test test/attachment-paths.test.mjs test/platform.test.mjs test/windows-packaging.test.mjs
      - name: Save Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/windows/*-windows-x64*-setup.exe
            dist/windows/*-windows-x64*-setup.exe.sha256
            dist/windows/*-windows-x64*-setup.exe.source.json
            dist/windows/*-windows-x64*-portable.zip
            dist/windows/*-windows-x64*-portable.zip.sha256
            dist/windows/*-windows-x64*-portable.zip.source.json
            dist/windows/RELEASE_NOTES.md
